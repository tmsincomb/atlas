<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" width="520" height="430" role="img" aria-label="Animated atlas hero: a parchment schema sheet projects a holographic directory tree; a scan sweep detects data units, checkmarks validate them, and gold pins locate key outputs">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1230"/>
      <stop offset="1" stop-color="#04081c"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f4e6c0"/>
      <stop offset="1" stop-color="#d9bf8a"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#46e3d4" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#46e3d4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#46e3d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d27e"/>
      <stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="520" height="430" rx="28" fill="url(#ink)"/>

  <!-- drifting star field -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-8 5;0 0" dur="20s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <circle cx="46" cy="58" r="1.5" fill="#c7d6ee"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="92" cy="116" r="1.1" fill="#e6c47a"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="196" r="1.3" fill="#c7d6ee"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="5s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="52" r="1" fill="#c7d6ee"><animate attributeName="opacity" values="0.4;0.95;0.4" dur="2.5s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="472" cy="64" r="1.4" fill="#c7d6ee"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="5s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="446" cy="132" r="1.1" fill="#e6c47a"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="492" cy="208" r="1.3" fill="#c7d6ee"><animate attributeName="opacity" values="0.8;0.25;0.8" dur="5s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="415" cy="44" r="1" fill="#c7d6ee"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="66" cy="296" r="1.2" fill="#c7d6ee"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="486" cy="318" r="1.2" fill="#c7d6ee"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="40" r="1.1" fill="#c7d6ee"><animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.5s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="58" r="0.9" fill="#c7d6ee"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" begin="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- grounded contact shadow (stays put while the scene bobs) -->
  <ellipse cx="260" cy="400" rx="175" ry="22" fill="url(#shadow)">
    <animate attributeName="rx" values="175;158;175" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>

  <!-- everything below floats: gentle vertical bob = pop out of the screen -->
  <g filter="url(#lift)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>

    <!-- holographic projection cone -->
    <polygon points="230,318 290,318 392,96 128,96" fill="url(#cone)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </polygon>

    <!-- parchment schema sheet (isometric), with thickness -->
    <polygon points="105,338 260,382 260,392 105,348" fill="#8f7346"/>
    <polygon points="415,338 260,382 260,392 415,348" fill="#6e5733"/>
    <polygon points="260,296 415,338 260,382 105,338" fill="url(#parch)"/>
    <polygon points="260,296 415,338 260,382 105,338" fill="none" stroke="#b9995e" stroke-width="1.5"/>
    <!-- faint blueprint grid -->
    <path d="M180,358 L335,316 M185,317 L340,359" stroke="#0e7490" stroke-width="1" opacity="0.16"/>

    <!-- abstract YAML lines: gold keys, ink values -->
    <g stroke-linecap="round" stroke-width="4.5">
      <path d="M148,332 L187,322" stroke="#c8963e"/>
      <path d="M196,319 L256,303" stroke="#3b4a6b"/>
      <path d="M188,335 L221,327" stroke="#c8963e"/>
      <path d="M230,325 L288,309" stroke="#4a628c"/>
      <path d="M214,342 L247,334" stroke="#c8963e"/>
      <path d="M256,332 L306,318" stroke="#2b7a8c"/>
      <path d="M253,346 L282,338" stroke="#c8963e"/>
      <path d="M291,336 L337,323" stroke="#4a628c"/>
      <path d="M252,360 L291,349" stroke="#c8963e"/>
      <path d="M300,347 L352,333" stroke="#3b4a6b"/>
    </g>

    <!-- compass rose (cartography), slowly turning -->
    <g transform="translate(352,346) scale(1,0.55)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
        <path d="M0,-10 L2.6,-2.6 L10,0 L2.6,2.6 L0,10 L-2.6,2.6 L-10,0 L-2.6,-2.6 Z" fill="#c8963e" opacity="0.9"/>
        <circle r="1.6" fill="#f4e6c0"/>
      </g>
    </g>

    <!-- projector glow where hologram meets the sheet -->
    <ellipse cx="260" cy="316" rx="40" ry="10" fill="#46e3d4" opacity="0.35" filter="url(#glow)">
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- holographic wireframe directory tree -->
    <g filter="url(#glow)">
      <!-- energy flowing up the connectors (DETECT) -->
      <path d="M260,136 v14 M260,150 h-84 v18 M260,150 h64 v18 M176,200 v10 M176,210 h-32 v18 M176,210 h28 v18 M324,200 v10 M324,210 h-16 v18 M324,210 h44 v18" fill="none" stroke="#2dd4bf" stroke-width="1.6" stroke-opacity="0.55" stroke-dasharray="3 5">
        <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.25s" repeatCount="indefinite"/>
      </path>

      <!-- root folder (wireframe box) -->
      <g stroke="#5eead4">
        <rect x="238" y="94" width="56" height="36" rx="5" fill="none" stroke-opacity="0.3"/>
        <path d="M232,100 L238,94 M288,100 L294,94 M288,136 L294,130" stroke-opacity="0.3"/>
        <rect x="232" y="93" width="20" height="8" rx="2" fill="#46e3d4" fill-opacity="0.2"/>
        <rect x="232" y="100" width="56" height="36" rx="5" fill="#22d3ee" fill-opacity="0.05" stroke-width="1.6">
          <animate attributeName="fill-opacity" values="0.05;0.05;0.4;0.05;0.05" keyTimes="0;0.83;0.89;0.97;1" dur="2.5s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- left folder -->
      <g stroke="#5eead4">
        <rect x="155" y="163" width="52" height="32" rx="4" fill="none" stroke-opacity="0.3"/>
        <path d="M150,168 L155,163 M202,168 L207,163 M202,200 L207,195" stroke-opacity="0.3"/>
        <rect x="150" y="162" width="18" height="7" rx="2" fill="#46e3d4" fill-opacity="0.2"/>
        <rect x="150" y="168" width="52" height="32" rx="4" fill="#22d3ee" fill-opacity="0.05" stroke-width="1.6">
          <animate attributeName="fill-opacity" values="0.05;0.05;0.4;0.05;0.05" keyTimes="0;0.54;0.6;0.7;1" dur="2.5s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- right folder -->
      <g stroke="#5eead4">
        <rect x="303" y="163" width="52" height="32" rx="4" fill="none" stroke-opacity="0.3"/>
        <path d="M298,168 L303,163 M350,168 L355,163 M350,200 L355,195" stroke-opacity="0.3"/>
        <rect x="298" y="162" width="18" height="7" rx="2" fill="#46e3d4" fill-opacity="0.2"/>
        <rect x="298" y="168" width="52" height="32" rx="4" fill="#22d3ee" fill-opacity="0.05" stroke-width="1.6">
          <animate attributeName="fill-opacity" values="0.05;0.05;0.4;0.05;0.05" keyTimes="0;0.54;0.6;0.7;1" dur="2.5s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- files -->
      <g stroke="#67e8f9" stroke-width="1.4">
        <rect x="124" y="228" width="40" height="26" rx="4" fill="#22d3ee" fill-opacity="0.05">
          <animate attributeName="fill-opacity" values="0.05;0.05;0.4;0.05;0.05" keyTimes="0;0.28;0.34;0.44;1" dur="2.5s" repeatCount="indefinite"/>
        </rect>
        <path d="M131,237 h20 M131,244 h14" stroke-opacity="0.55"/>
        <rect x="184" y="228" width="40" height="26" rx="4" fill="#22d3ee" fill-opacity="0.05">
          <animate attributeName="fill-opacity" values="0.05;0.05;0.4;0.05;0.05" keyTimes="0;0.28;0.34;0.44;1" dur="2.5s" repeatCount="indefinite"/>
        </rect>
        <path d="M191,237 h20 M191,244 h12" stroke-opacity="0.55"/>
        <rect x="288" y="228" width="40" height="26" rx="4" fill="#22d3ee" fill-opacity="0.05">
          <animate attributeName="fill-opacity" values="0.05;0.05;0.4;0.05;0.05" keyTimes="0;0.28;0.34;0.44;1" dur="2.5s" repeatCount="indefinite"/>
        </rect>
        <path d="M295,237 h20 M295,244 h15" stroke-opacity="0.55"/>
        <rect x="348" y="228" width="40" height="26" rx="4" fill="#22d3ee" fill-opacity="0.05">
          <animate attributeName="fill-opacity" values="0.05;0.05;0.4;0.05;0.05" keyTimes="0;0.28;0.34;0.44;1" dur="2.5s" repeatCount="indefinite"/>
        </rect>
        <path d="M355,237 h20 M355,244 h11" stroke-opacity="0.55"/>
      </g>
    </g>

    <!-- DETECT: scan line sweeping up through the projection -->
    <g filter="url(#glow)">
      <line x1="232" y1="316" x2="288" y2="316" stroke="#9ff7ec" stroke-width="2.2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -220" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="x1" values="232;134" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="288;386" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.08;0.9;1" dur="2.5s" repeatCount="indefinite"/>
      </line>
      <!-- rising sparks -->
      <circle cx="250" cy="312" r="2" fill="#9ff7ec">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -195" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.2;1" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="274" cy="308" r="1.6" fill="#9ff7ec">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -180" dur="2.5s" begin="1.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.2;1" dur="2.5s" begin="1.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="238" cy="305" r="1.6" fill="#9ff7ec">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -185" dur="2.5s" begin="1.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.2;1" dur="2.5s" begin="1.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- VALIDATE: check badges -->
    <g transform="translate(202,168)">
      <circle r="8" fill="#0fb89b">
        <animate attributeName="r" values="7.4;8.6;7.4" dur="2.5s" begin="1.7s" repeatCount="indefinite"/>
      </circle>
      <path d="M-3.6,0.2 L-1,2.8 L3.8,-2.6" fill="none" stroke="#eafff9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2.5s" begin="1.7s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(350,168)">
      <circle r="8" fill="#0fb89b">
        <animate attributeName="r" values="7.4;8.6;7.4" dur="2.5s" begin="1.9s" repeatCount="indefinite"/>
      </circle>
      <path d="M-3.6,0.2 L-1,2.8 L3.8,-2.6" fill="none" stroke="#eafff9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2.5s" begin="1.9s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(164,228)">
      <circle r="7" fill="#0fb89b">
        <animate attributeName="r" values="6.5;7.6;6.5" dur="2.5s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <path d="M-3.1,0.2 L-0.9,2.4 L3.3,-2.2" fill="none" stroke="#eafff9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2.5s" begin="1.1s" repeatCount="indefinite"/>
    </g>
    <!-- one warning on an invalid unit -->
    <g transform="translate(328,227)">
      <path d="M0,-8 L7.5,5.5 L-7.5,5.5 Z" fill="#f5a524" stroke="#b97508" stroke-width="1" stroke-linejoin="round"/>
      <line x1="0" y1="-3.4" x2="0" y2="1.6" stroke="#3b2a05" stroke-width="1.8" stroke-linecap="round"/>
      <circle cy="3.8" r="1" fill="#3b2a05"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.25s" repeatCount="indefinite"/>
    </g>

    <!-- LOCATE: gold pins with pulsing halos on two key outputs -->
    <circle cx="204" cy="230" r="5" fill="none" stroke="#f0c96b" stroke-width="2">
      <animate attributeName="r" values="4;16" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(204,226)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="204 226;204 222;204 226" dur="2.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <path d="M0,0 C-2.5,-6 -9,-9 -9,-16 A9,9 0 1 1 9,-16 C9,-9 2.5,-6 0,0 Z" fill="url(#gold)" stroke="#a86f14" stroke-width="1"/>
      <circle cy="-16" r="3.4" fill="#1b2440"/>
    </g>
    <circle cx="368" cy="230" r="5" fill="none" stroke="#f0c96b" stroke-width="2">
      <animate attributeName="r" values="4;16" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(368,226)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="368 226;368 222;368 226" dur="2.5s" begin="1.25s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <path d="M0,0 C-2.5,-6 -9,-9 -9,-16 A9,9 0 1 1 9,-16 C9,-9 2.5,-6 0,0 Z" fill="url(#gold)" stroke="#a86f14" stroke-width="1"/>
      <circle cy="-16" r="3.4" fill="#1b2440"/>
    </g>
  </g>
</svg>
