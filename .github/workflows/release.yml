name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  deployments: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
      - name: deploy annotation and notification
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          deployment_id=$(printf '{"ref":"%s","environment":"release","auto_merge":false,"required_contexts":[],"description":"atlas %s"}' "$TAG" "$TAG" \
            | gh api "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq .id)
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            -f state=success -f environment_url="$release_url" \
            -f description="atlas ${TAG} released"
          {
            echo "## Deployed ${TAG}"
            echo "- Release: ${release_url}"
            echo "- Deploy annotation: GitHub Deployment (environment: release)"
          } >> "$GITHUB_STEP_SUMMARY"
