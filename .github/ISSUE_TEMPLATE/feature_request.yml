name: Feature request
description: Suggest a new capability for atlas
labels: ["type/feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that atlas can't do (or makes hard) today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Desired CLI command/flags or schema behavior. Sketch the invocation and expected output if you can.
      render: shell
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried or other designs that could solve this.
